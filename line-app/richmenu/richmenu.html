<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Innow rich menu</title>
<style>
  @font-face { font-family: 'Anuphan'; src: url('../../fonts/Anuphan-Variable.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'IBM Plex Sans Thai'; src: url('../../fonts/IBMPlexSansThai-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans Thai'; src: url('../../fonts/IBMPlexSansThai-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'IBM Plex Sans Thai'; src: url('../../fonts/IBMPlexSansThai-SemiBold.ttf'); font-weight: 600; }
  :root { --navy: #082955; --blue: #014799; --light: #E9F3FF; --line: #C9DDF5; --bg: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; background: var(--bg); }
  .cell { position: absolute; height: 843px; padding: 24px; }
  .card {
    width: 100%; height: 100%; border-radius: 56px; background: var(--light);
    border: 4px solid var(--line); color: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding-top: 70px;
  }
  .card.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .num { position: absolute; top: 64px; left: 64px; width: 84px; height: 84px; border-radius: 50%;
    font: 600 48px/84px 'IBM Plex Sans Thai', sans-serif; text-align: center; background: #fff; color: var(--blue); }
  .primary .num { background: rgba(255,255,255,.18); color: #fff; }
  svg { width: 230px; height: 230px; margin-bottom: 44px; fill: none; stroke: var(--blue); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .primary svg { stroke: #fff; }
  .label { font: 600 112px/1.15 'Anuphan', sans-serif; white-space: nowrap; letter-spacing: -2px; }
  .sub { font: 500 72px/1.3 'IBM Plex Sans Thai', sans-serif; margin-top: 14px; white-space: nowrap; opacity: .85; }
  .cell > .card { position: relative; }
</style>
</head>
<body>

<div class="cell" style="left:0;top:0;width:833px"><div class="card primary"><span class="num">1</span>
  <svg viewBox="0 0 96 96"><path d="M48 24c-8-7-20-9-32-6v50c12-3 24-1 32 6 8-7 20-9 32-6V18c-12-3-24-1-32 6z"/><path d="M48 24v50"/></svg>
  <div class="label">Workshop</div><div class="sub">คลังบทเรียน</div></div></div>

<div class="cell" style="left:833px;top:0;width:833px"><div class="card primary"><span class="num">2</span>
  <svg viewBox="0 0 96 96"><circle cx="28" cy="48" r="16"/><path d="M44 48h40M70 48v14M82 48v10"/><circle cx="28" cy="48" r="3"/></svg>
  <div class="label">รับสิทธิ์</div><div class="sub">กรอกรหัส 4 หลัก</div></div></div>

<div class="cell" style="left:1666px;top:0;width:834px"><div class="card"><span class="num">3</span>
  <svg viewBox="0 0 96 96"><path d="M36 66V58c-8-5-12-12-12-20a24 24 0 0 1 48 0c0 8-4 15-12 20v8z"/><path d="M38 76h20M42 86h12"/></svg>
  <div class="label">Prompt Library</div><div class="sub">รวม Prompt</div></div></div>

<div class="cell" style="left:0;top:843px;width:833px"><div class="card"><span class="num">4</span>
  <svg viewBox="0 0 96 96"><rect x="14" y="36" width="68" height="16" rx="3"/><path d="M20 52v26h56V52M48 36v42"/><path d="M48 36c-6-16-22-16-22-6s14 6 22 6zM48 36c6-16 22-16 22-6s-14 6-22 6z"/></svg>
  <div class="label">Bonus</div><div class="sub">Workshop เสริม</div></div></div>

<div class="cell" style="left:833px;top:843px;width:833px"><div class="card"><span class="num">5</span>
  <svg viewBox="0 0 96 96"><path d="M16 40v16l10 2 8 20h8L36 58 70 70V26L26 40z"/><path d="M80 38c4 5 4 15 0 20"/></svg>
  <div class="label">ข่าวสาร</div><div class="sub">Facebook Innow</div></div></div>

<div class="cell" style="left:1666px;top:843px;width:834px"><div class="card"><span class="num">6</span>
  <svg viewBox="0 0 96 96"><path d="M16 24h64a6 6 0 0 1 6 6v30a6 6 0 0 1-6 6H44L28 80V66H16a6 6 0 0 1-6-6V30a6 6 0 0 1 6-6z"/><path d="M28 40h40M28 52h26"/></svg>
  <div class="label">ติดต่อเรา</div><div class="sub">แชตกับทีมงาน</div></div></div>

</body>
</html>
